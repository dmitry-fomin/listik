[server]
host = "127.0.0.1"
port = 8787

[auth]
token = "test-token"

[embed]
enabled = true
model = "bge-m3"
url = "http://127.0.0.1:11434"
batch = 16
max_chars = 6000

# Помощник при создании задачи (DeepSeek, OpenAI-совместимый chat/completions).
# Пустой api_key = помощник выключен: кнопки у полей формы прячутся, а
# POST /api/assistant/suggest отвечает понятной ошибкой. Ключ читает только
# сервер — в браузер он не уходит.
[assistant]
api_key = ""
base_url = "https://api.deepseek.com"
model = "deepseek-flash"

# Расшифровка голосовой записи (Deepgram, POST /v1/listen). Пустой api_key =
# голос выключен: кнопка записи у формы не появляется, а
# POST /api/assistant/transcribe отвечает понятной ошибкой. Голос включается
# только вместе с помощником — нужны оба ключа, [deepgram] и [assistant].
# Ключ читает только сервер — в браузер он не уходит.
[deepgram]
api_key = ""
base_url = "https://api.deepgram.com"
model = "nova-2"
language = "ru"

# Рой. true — сервер сам держит один процесс на все проекты и проверяет их
# каждые 30 секунд. Ключи модели (api_key, base_url, model, command) нужны
# проходам plan/rescope, а model — ещё и арбитру барьера. Обычно достаточно
# раскомментировать только api_key; остальные параметры имеют дефолты.
# Запасные модели и признак переключения — docs/usage.md, «Модель роя».
[swarm]
enabled = false
# api_key = ""                                # ключ провайдера (или LISTIK_SWARM_API_KEY)
# base_url = "https://openrouter.ai/api/v1"   # OpenAI-совместимый chat/completions
# model = "z-ai/glm-5.3-flash"                # одно имя на plan, rescope и {model} арбитра
# jev_api_key = ""                            # проверка рёбер plan (и слияния арбитра): пусто — выкл
# jev_url = "https://openrouter.ai/api/alpha/decisions"
# jev_model = "typesafe/jev-1.13"

[import]
projects_root = "/Users/pathToProjects"
max_depth = 6

[board]
stale_hours = 24
wip_warn_hours = 8
assign_warn_minutes = 15
